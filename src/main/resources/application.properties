spring.application.name=Online-Movie-Ticket-Reservation-Management

# ==============================
# MySQL DataSource
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_ticket_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# Server
# ==============================
server.port=8085

# ==============================
# JWT
# ==============================
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
app.jwt.expiration-ms=86400000

# ==============================
# Actuator
# ==============================
management.endpoints.web.exposure.include=health,info
